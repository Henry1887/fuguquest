# Cross-compile the on-device (--local) build:
#   cargo build --release --target aarch64-linux-android
# Point `linker` at your NDK's aarch64-linux-android<API>-clang, or put that NDK
# .../toolchains/llvm/prebuilt/<host>/bin on your PATH and keep the bare name below.
[target.aarch64-linux-android]
linker = "aarch64-linux-android30-clang"
